<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تم تسجيل الدخول — LOQUIRA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .desktop-success-card {
      max-width: 420px;
      margin: 10vh auto;
      padding: 2rem;
      text-align: center;
      background: var(--card-bg, #1a1d24);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .desktop-success-card h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #2ecc71; }
    .desktop-success-card p { color: #b0b8c4; line-height: 1.6; margin-bottom: 1.5rem; }
    .desktop-success-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body class="auth-page">
  <div class="desktop-success-card">
    <h1>✅ تم تسجيل الدخول بنجاح</h1>
    <p>يمكنك الآن العودة إلى تطبيق LOQUIRA — سيفتح تلقائياً بحسابك.</p>
    <button type="button" class="desktop-success-btn" id="open-app-btn">فتح تطبيق LOQUIRA</button>
    <p style="margin-top:1rem;font-size:0.85rem;">إذا لم يفتح التطبيق، اضغط الزر أعلاه أو ارجع إلى نافذة LOQUIRA.</p>
  </div>
  <script type="module">
    import { openDesktopApp } from './js/desktop-auth.js';
    const params = new URLSearchParams(window.location.search);
    const state = params.get('state') || '';
    document.getElementById('open-app-btn').addEventListener('click', () => openDesktopApp(state));
    setTimeout(() => openDesktopApp(state), 800);
  </script>
</body>
</html>
